# .github/workflows/release.yml — komplette Datei ersetzen
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            osdir: mac
          - os: windows-latest
            osdir: win
          - os: ubuntu-latest
            osdir: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Freeze Python engine
        run: |
          pip install rdkit pyinstaller
          pyinstaller --onedir --name engine3d --collect-all rdkit --distpath bin/${{ matrix.osdir }} --workpath pybuild --specpath pybuild engine_3d.py

      - name: Build app (ohne Publish)
        run: npx electron-builder --publish never

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Alle Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Eine einzige Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes