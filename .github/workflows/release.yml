name: Release

# Auslösen durch einen Versions-Tag, z. B.:  git tag v1.1.1 && git push origin v1.1.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1) Jede Plattform baut NUR (kein Publish) und legt ihre Installer als Artefakt ab
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Build app (ohne Publish)
        run: npx electron-builder --publish never

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: ignore

  # 2) EIN Abschluss-Job sammelt alles ein und macht genau EINE Release
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Alle Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Eine einzige Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # evtl. vorhandene (kaputte) Release zum selben Tag wegräumen, Tag aber behalten
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
