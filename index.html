<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Mein Chemie Editor</title>
    <style>
      body { font-family: sans-serif; }
      
      /* Toolbar Styling */
      #toolbar { margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
      button { padding: 5px 10px; cursor: pointer; }

      /* Das PSE Popup (Initial versteckt) */
      #pse-menu {
        display: none; /* Standardmäßig unsichtbar */
        position: absolute;
        top: 50px; left: 10px;
        background: white;
        border: 2px solid #333;
        padding: 10px;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        z-index: 1000; /* Immer ganz oben */
      }

      /* Das Raster für die Elemente */
      #pse-grid {
        display: grid;
        grid-template-columns: repeat(18, 30px); /* 18 Spalten à 30px */
        grid-template-rows: repeat(7, 30px);     /* 7 Zeilen à 30px */
        gap: 2px;
      }

      /* Die einzelnen Element-Kacheln */
      .element-btn {
        width: 100%; height: 100%;
        border: 1px solid #999;
        font-size: 10px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .element-btn:hover { border-color: black; transform: scale(1.1); }
    </style>
  </head>
  <body>
    <h1>Chemie Editor Alpha</h1>
    
    <div id="toolbar">
  <button id="btn-draw" style="font-weight:bold; background-color:#ddd;">✏️ Zeichnen</button>
  <button id="btn-move">Move</button>
  <button id="btn-erase">Erase</button>
  <button id="btn-select">Lasso</button>
  <button id="btn-text" style="font-weight:bold;">Abc Text</button>
  <button id="btn-arrow" style="font-weight:bold;">➔ Pfeil</button>
  
  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  
  <label for="bond-length-slider" style="font-size: 13px;">Länge: <span id="bond-length-val">60</span></label>
  <input type="range" id="bond-length-slider" min="20" max="150" value="60" style="width: 80px; vertical-align: middle;">
  
  <label for="font-size-slider" style="font-size: 13px; margin-left: 5px;">Schrift: <span id="font-size-val">16</span></label>
  <input type="range" id="font-size-slider" min="10" max="36" value="16" style="width: 70px; vertical-align: middle;">
  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  
  <button id="btn-pse">Choose element...</button>
  <span id="current-element-display" style="font-weight: bold; margin-left: 5px;">[ C ]</span>

  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  <button id="btn-undo">Undo</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-clean">Clean-up</button>

  <button id="btn-warnings" style="background-color: #ffcccc;">⚠️ Warnings: On</button>
  
  <button id="btn-grid" style="background-color: #eee;">🔲 Grid: Off</button>
  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  <button id="btn-save" style="background-color: #e2e3e5;">💾 Speichern (.chema)</button>
  <button id="btn-load" style="background-color: #e2e3e5;">📂 Öffnen</button>
  <input type="file" id="file-load" style="display: none;" accept=".chem,.svg" />
  <button id="btn-smiles" style="background-color: #ffe8a1; font-weight: bold;">🧬 SMILES</button>

  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  <label for="bond-length-slider" style="font-size: 13px;">Länge: <span id="bond-length-val">60</span></label>
  <input type="range" id="bond-length-slider" min="20" max="150" value="60" style="width: 80px; vertical-align: middle;">
  <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
  <button id="btn-export-svg" style="background-color: #d4edda; font-weight: bold;">💾 SVG</button>
  <button id="btn-export-pdf" style="background-color: #f8d7da; font-weight: bold;">📄 PDF</button>
</div> 

<div id="pse-menu">
  <div id="pse-grid">
  </div>
  <button id="btn-close-pse" style="margin-top: 10px; width: 100%;">Close</button>
</div>

    <canvas id="chemBoard" width="800" height="600" style="border:1px solid #ccc; cursor: crosshair;"></canvas>

    <div id="custom-text-editor" style="display:none; position:absolute; z-index:1000; background:white; border:2px solid #0088ff; border-radius:4px; padding:8px; box-shadow:0 4px 10px rgba(0,0,0,0.2); font-family: sans-serif;">
        <input type="text" id="custom-text-input" placeholder="z.B. OPO_3^(2-)" style="width:150px; outline:none; border:1px solid #ccc; padding:4px; margin-bottom: 5px;">
        <br>
        <label style="font-size: 12px; cursor: pointer;">
            <input type="checkbox" id="custom-text-flip"> Zur Bindung ausrichten
        </label>
        <br>
        <label style="font-size: 12px; cursor: pointer;">
            <input type="checkbox" id="custom-text-align"> Am 1. Buchstaben zentrieren
        </label>
        <br>
        <button id="custom-text-save" style="cursor:pointer; margin-top: 5px; width: 100%; background: #0088ff; color: white; border: none; padding: 4px;">OK</button>
    </div>
    <div id="smiles-dialog" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; border:2px solid #333; border-radius:8px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.3); z-index:2000; text-align: center; font-family: sans-serif;">
        <h3 style="margin-top:0;">SMILES Code</h3>
        <input type="text" id="smiles-input" style="width: 350px; padding: 8px; font-family: monospace; font-size: 14px; margin-bottom: 15px;" />
        <br>
        <button id="smiles-btn-import" style="padding: 8px 15px; cursor: pointer; background: #0088ff; color: white; border: none; border-radius: 4px; font-weight: bold;">Als Molekül Importieren</button>
        <button id="smiles-btn-close" style="padding: 8px 15px; cursor: pointer; background: #ccc; border: none; border-radius: 4px; margin-left: 10px;">Schließen</button>
    </div>
    <script>
      require('./dist/renderer.js');
    </script>
  </body>
</html>
