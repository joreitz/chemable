<!DOCTYPE html>
<html lang="de">
<head>
    <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    
    <script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemable Editor</title>
    <style>
        /* --- GLOBALE STYLES --- */
        :root {
            --primary: #4f46e5;       /* Modernes Indigoblau für aktive Elemente */
            --primary-bg: #e0e7ff;    /* Heller Hintergrund für aktive Buttons */
            --text-main: #374151;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        /* --- CANVAS --- */
        #chemBoard {
            position: absolute;
            top: 0; left: 0;
            background-color: #ffffff;
            z-index: 1;
        }

        /* --- GLASSMORPHISM PANELS --- */
        .glass-panel {
            position: absolute;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 12px;
            display: flex;
        }

        /* Top Bar (Datei, Bearbeiten, etc.) */
        #menubar {
            top: 20px;
            right: 20px;
            padding: 5px 15px;
            align-items: center;
            gap: 10px;
        }

        /* Side Bar (Werkzeuge zum Zeichnen) */
        #toolbar {
            top: 90px;
            left: 20px;
            padding: 10px;
            flex-direction: column;
            gap: 8px;
            width: 160px;
        }

        /* --- BUTTONS --- */
        button {
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Spezielles Styling für die aktiven Werkzeuge */
        .tool-btn { font-weight: 500; width: 100%; }
        
        /* Diese Klasse wird per JS gesetzt, wenn ein Tool aktiv ist */
        .tool-btn.active {
            background-color: var(--primary-bg) !important;
            color: var(--primary) !important;
            font-weight: 600;
        }

        /* --- DROPDOWNS --- */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { 
            display: none; position: absolute; 
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.1);
            min-width: 200px; 
            box-shadow: var(--shadow); 
            z-index: 2000; 
            border-radius: 8px;
            top: 100%; 
            margin-top: 0px; 
            padding: 5px 0;
            overflow: hidden;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content button { width: 100%; border-radius: 0; padding: 10px 16px; }
        .menu-btn { font-weight: 600; }

        hr.divider { margin: 4px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.1); }

        /* --- SLIDER BEREICH --- */
        .slider-group {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; margin-left: 15px;
            padding-left: 15px; border-left: 1px solid rgba(0,0,0,0.1);
        }
        .slider-group input { width: 80px; cursor: pointer; }
        .slider-group span { font-weight: bold; min-width: 20px; display: inline-block; text-align: right;}

        /* --- MODALS (Dialogfenster) --- */
        .modal {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            font-family: sans-serif;
            color: var(--text-main);
        }
        
        .modal h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 8px; }
        .modal input[type="text"] { border: 1px solid #ccc; border-radius: 6px; padding: 8px; width: calc(100% - 18px); outline: none; transition: border 0.2s;}
        .modal input[type="text"]:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: white; font-weight: bold; justify-content: center; width: 100%; padding: 10px;}
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #e5e7eb; font-weight: bold; justify-content: center; width: 100%; padding: 10px; margin-top: 8px;}

        /* --- KNOWITALL LIVE VIEWER  --- */
        #knowitall-glass-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 35px;
            border-radius: 15px;
            
            /* Modern Frosted Glass Effect */
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            
            color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            pointer-events: auto; 
            z-index: 1000; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #knowitall-name { 
            margin: 0 0 6px 0; 
            font-size: 20px; 
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #000;
        }

        #knowitall-details { 
            margin: 0; 
            font-size: 13px; 
            color: #444; 
            font-weight: 500;
        }

        .xlogp-badge {
            background: #007bff;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: bold;
        }
    </style>
</head>
    </style>
</head>
<body>

    <div id="menubar" class="glass-panel">
        <div class="dropdown">
            <button class="menu-btn">File</button>
            <div class="dropdown-content">
                <button id="btn-save"> Save (.chem)</button>
                <button id="btn-load"> Open...</button>
                <hr class="divider">
                <button id="btn-export-svg"> Export as SVG</button>
                <button id="btn-export-png"> Export as PNG</button>
                <button id="btn-export-xyz"> Export as .xyz</button>
                <button id="btn-smiles"> SMILES in-/export</button>
            </div>
        </div>

        <div class="dropdown">
            <button class="menu-btn">Templates</button>
            <div class="dropdown-content" id="template-dropdown">
                </div>
        </div>

        <div class="dropdown">
            <button class="menu-btn"> Edit</button>
            <div class="dropdown-content">
                <button id="btn-undo"> Undo (Ctrl+Z)</button>
                <button id="btn-clean"> Auto-Layout </button>
                <button id="btn-clear"> Clear All</button>
                <hr class="divider">
                <button id="btn-hotkeys">Change hotkeys</button>
            </div>
        </div>

        <div class="dropdown">
            <button class="menu-btn"> View </button>
            <div class="dropdown-content">
                <button id="btn-warnings"> Warning: On</button>
                <button id="btn-grid"> Grid: Off</button>
                <button id="btn-toggle-hydrogens" class="tool-btn" title="Wasserstoffe an Heteroatomen ein-/ausblenden">Toggle H</button>
            </div>
        </div>

        <div class="dropdown">
            <button class="menu-btn"> Plugins</button>
            <div class="dropdown-content" id="plugin-dropdown-content">
                </div>
            <div id="plugin-info-area" style="display:none;"></div>
        </div>

        <div class="slider-group">
            <label for="bond-length-slider">Length:</label>
            <input type="range" id="bond-length-slider" min="20" max="150" value="60">
            <span id="bond-length-val">60</span>
        </div>
        
        <div class="slider-group" style="border-left:none; margin-left:0; padding-left:0;">
            <label for="font-size-slider">Font:</label>
            <input type="range" id="font-size-slider" min="10" max="36" value="16">
            <span id="font-size-val">27</span>
        </div>
    </div>

    <div id="toolbar" class="glass-panel">

    <details class="tool-section" open>
        <summary>Drawing</summary>
        <div class="group-body">
            <button id="btn-draw"   class="tool-btn active" title="Zeichnen (D)">Draw</button>
            <button id="btn-wedge"  class="tool-btn" title="Keil (W)">Wedge</button>
            <button id="btn-dash"   class="tool-btn" title="Gestrichelt (S)">Dash</button>
            <button id="btn-move"   class="tool-btn" title="Verschieben (M)">Move</button>
            <button id="btn-erase"  class="tool-btn" title="Radierer (E)">Eraser</button>
            <button id="btn-select" class="tool-btn" title="Lasso Auswahl (L)">Lasso</button>
            <button id="btn-arrow"  class="tool-btn" title="Reaktionspfeil (A)">Arrow</button>
        </div>
    </details>

    <details class="tool-section" open>
        <summary>Atom</summary>
        <div class="group-body">
            <div class="group-row">
                <button id="btn-charge-plus"  class="tool-btn" title="Positive Ladung">⊕</button>
                <button id="btn-charge-minus" class="tool-btn" title="Negative Ladung">⊖</button>
                <button id="btn-radical"      class="tool-btn" title="Radikal">•</button>
            </div>
        </div>
    </details>

    <details class="tool-section" open>
        <summary>3D &amp; Viewer</summary>
        <div class="group-body">
            <button id="btn-cube"      class="tool-btn" title="Cube / MO Viewer">Cube</button>
            <button id="btn-3d"        class="tool-btn" title="3D Ansicht (Kraftfeld)">3D Viewer</button>
            <button id="btn-rotate-3d" class="tool-btn" title="3D Rotation">3D Rotation</button>
            <button id="btn-align-3d"  class="tool-btn" title="An y-Achse ausrichten">Align 3D</button>
        </div>
    </details>

    <details class="tool-section" open>
        <summary>Data</summary>
        <div class="group-body">
            <button id="btn-export-smiles" class="tool-btn" title="SMILES exportieren">Export SMILES</button>
            <button id="btn-knowitall"     class="tool-btn" title="Datenbank-Suche">KnowItAll</button>
        </div>
    </details>

    <details class="tool-section" open>
        <summary>Display</summary>
        <div class="group-body">
            <button id="btn-style-menu" class="tool-btn" title="Document & Selection Styles">Styles</button>
        </div>
    </details>

    <div style="background: rgba(0,0,0,0.03); border-radius: 8px; padding: 10px; margin-top: 6px; text-align: center;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 5px;">Chosen atom</div>
        <span id="current-element-display" style="font-size: 18px; font-weight: 800; color: var(--primary);">C</span>
        <button id="btn-pse" style="width: 100%; justify-content: center; background: white; border: 1px solid #ddd; margin-top: 8px; font-size: 12px; padding: 4px;">Open PSE</button>
    </div>

    </div>

    <canvas id="chemBoard" width="800" height="600"></canvas>

    <div id="custom-text-editor" class="modal" style="display:none; position:absolute; z-index:1000; padding:12px; width: 180px;">
        <input type="text" id="custom-text-input" placeholder="e.g., OPO_(3)^(2-)" style="margin-bottom: 10px;">
        <label style="font-size: 12px; cursor: pointer; display: block; margin-bottom: 5px;">
            <input type="checkbox" id="custom-text-flip"> Align to bond
        </label>
        <label style="font-size: 12px; cursor: pointer; display: block; margin-bottom: 10px;">
            <input type="checkbox" id="custom-text-align"> Align to first letter
        </label>
        <button id="custom-text-save" class="btn-primary">Save</button>
    </div>

    <div id="hotkeys-dialog" class="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:25px; width: 320px; z-index:2000;">
        <h3>Hotkeys</h3>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 15px; align-items: center; font-size: 14px;">
            <label>Copy (Ctrl +)</label><input type="text" id="hk-copy" maxlength="1" style="text-align: center; text-transform: lowercase;">
            <label>Paste (Ctrl +)</label><input type="text" id="hk-paste" maxlength="1" style="text-align: center; text-transform: lowercase;">
            <label>Cut (Ctrl +)</label><input type="text" id="hk-cut" maxlength="1" style="text-align: center; text-transform: lowercase;">
            <label>Undo (Ctrl +)</label><input type="text" id="hk-undo" maxlength="1" style="text-align: center; text-transform: lowercase;">
            <label>Text Editor</label><input type="text" id="hk-text" maxlength="1" style="text-align: center; text-transform: lowercase;">
        </div>
        <button id="hk-btn-save" class="btn-primary">Save</button>
        <button id="hk-btn-close" class="btn-secondary">Cancel</button>
    </div>
    
    <div id="smiles-dialog" class="modal" style="display:none; position:fixed; top:30%; left:50%; transform:translate(-50%, -50%); padding:20px; width: 400px; z-index:2000;">
        <h3 style="margin-top:0;">SMILES In-/Export</h3>
        <p style="font-size:12px; color:#666;">Copy the current string or paste a new one.</p>
        <textarea id="smiles-input" style="width:calc(100% - 18px); height:60px; margin-bottom:10px; padding:8px; border-radius:6px; border:1px solid #ccc; resize:none; font-family:monospace;"></textarea>
        <div style="display:flex; justify-content:space-between; gap:10px;">
            <button id="btn-dialog-import" class="btn-primary" style="margin:0;">Import</button>
            <button id="btn-dialog-close" class="btn-secondary" style="margin:0;">Exit</button>
        </div>
    </div>

    <div id="pse-menu" class="modal" style="display:none; position:absolute; top:80px; left: 200px; padding:20px; z-index:2000;">
        <h3 style="display:flex; justify-content:space-between; align-items:center;">
            Periodic system of elements
            <button id="btn-close-pse" style="padding: 0; width: 24px; height: 24px; justify-content: center;">✖</button>
        </h3>
        <div id="pse-grid" style="display:grid; grid-template-columns:repeat(18, 30px); grid-template-rows:repeat(7, 30px); gap:3px; font-size: 12px; font-weight: bold; text-align: center; line-height: 30px;">
            </div>
    </div>
    
    <div id="style-panel" class="modal" style="display: none; position: absolute; top: 90px; left: 200px; padding: 20px; width: 240px; z-index: 1000;">
        <h3>Properties</h3>
        <div style="margin-bottom: 15px;">
            <label for="color-picker" style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold;">Color (Local/Global):</label>
            <input type="color" id="color-picker" value="#000000" style="width: 100%; height: 35px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; padding: 2px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="bond-spacing-slider" style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; font-weight: bold;">
                <span>Bond Spacing:</span> <span style="font-weight: normal;"><span id="bond-spacing-val">5</span>px</span>
            </label>
            <input type="range" id="bond-spacing-slider" min="2" max="12" value="5" style="width: 100%;">
        </div>
        <div style="margin-bottom: 20px;">
            <label for="font-family-select" style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold;">Font Family:</label>
            <select id="font-family-select" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none;">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
            </select>
        </div>
        <button id="btn-close-style-panel" class="btn-secondary">Close</button>
    </div>

    <input type="file" id="file-load" style="display: none;" accept=".chem,.svg">
    
    <div id="viewer3d-dialog" class="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:20px; width: 600px; height: 500px; z-index:2000; flex-direction:column; box-shadow: 0 25px 50px rgba(0,0,0,0.5);">
        <h3 style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            3D Structure
            <button id="btn-close-3d" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #666;">✖</button>
        </h3>
        <div id="container-3d" style="flex-grow: 1; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; position: relative; overflow: hidden;"></div>
        
        <div style="display:flex; justify-content: flex-end; padding-top: 15px;">
            <button id="btn-apply-3d" class="btn-primary" style="width: auto; padding: 10px 20px;">Use 3D structure on canvas</button>
        </div>

    </div>

    <div id="cube-dialog" class="modal" style="display:none; position:fixed; inset:5%;
     z-index:2000; padding:0; flex-direction:row; overflow:hidden;">
    <div id="cube-canvas" style="flex:1; position:relative; background:#fff;"></div>
    <div style="width:240px; padding:16px; display:flex; flex-direction:column; gap:14px;
        border-left:1px solid rgba(0,0,0,0.1); overflow:auto;">
        <h3 id="cube-drag-handle" style="margin:0; cursor:move;">Cube / MO Viewer</h3>

        <label style="font-size:12px; font-weight:600;">Load .cube-files</label>
        <input type="file" id="cube-file-input" accept=".cube,.cub" multiple>

        <label style="font-size:12px; font-weight:600;">MO</label>
        <select id="cube-mo-select" style="padding:6px; border-radius:6px;"></select>

        <label style="font-size:12px; font-weight:600;">Representation</label>
        <div style="display:flex; gap:6px;">
        <button class="tool-btn active" data-cube-repr="ballstick" style="flex:1;">Ball&amp;Stick</button>
        <button class="tool-btn" data-cube-repr="wire" style="flex:1;">Wire</button>
        </div>

        <label style="font-size:12px; cursor:pointer;">
        <input type="checkbox" id="cube-show-h" checked> Show H
        </label>

        <label style="font-size:12px; font-weight:600;">Isovalue ±</label>
    	<div style="display:flex; gap:8px; align-items:center;">
      		<input type="range" id="cube-iso" min="0.001" max="0.1" step="0.001" value="0.02" style="flex:1;">
      		<input type="number" id="cube-iso-num" min="0.0001" step="0.001" value="0.02"
             style="width:72px; padding:4px; border:1px solid #ccc; border-radius:6px;">
   	 </div>
        <input type="range" id="cube-iso" min="0.001" max="0.1" step="0.001" value="0.02">
 	
	<label style="font-size:12px; font-weight:600;">Presentation preset (JSON)</label>
    	<input type="file" id="cube-preset-input" accept=".json,application/json">
 	<button id="btn-cube-preset-clear" class="tool-btn" style="justify-content:center; border:1px solid #ddd;">Remove preset</button>

        <label style="font-size:12px; font-weight:600;">Colors of volume data (+ / −)</label>
        <div style="display:flex; gap:10px; align-items:center;">
        <input type="color" id="cube-col-plus"  value="#3b82f6">
        <input type="color" id="cube-col-minus" value="#ef4444">
        </div>

        <label style="font-size:12px; cursor:pointer;">
            <input type="checkbox" id="cube-lock-view" checked> Fix of orientation
        </label>
        <button id="btn-cube-fit" class="tool-btn" style="justify-content:center; border:1px solid #ddd;">Centering view</button>
        
        <button id="btn-cube-to-canvas" class="btn-secondary" style="justify-content:center;">Project on canvas</button>

        <label style="font-size:12px; font-weight:600;">Export image</label>
        <div style="display:flex; gap:8px; align-items:center;">
        <select id="cube-export-scale" style="flex:1; padding:6px; border-radius:6px;">
            <option value="2">2×</option>
            <option value="4" selected>4×</option>
        </select>
        <button id="btn-cube-export" class="btn-primary" style="flex:1; margin:0;">PNG</button>
        </div>

        <button id="btn-cube-close" class="btn-secondary" style="margin-top:auto;">Close</button>
    </div>
    </div>

    <div id="knowitall-dialog" class="modal" style="display:none; position:fixed; top:20%; left:50%; transform:translate(-50%, 0); padding:20px; width: 400px; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2000; font-family: sans-serif;">
    <h3 style="margin-top: 0; display: flex; justify-content: space-between;">
         KnowItAll Search
        <button id="btn-close-knowitall" style="background: none; border: none; font-size: 16px; cursor: pointer;">✖</button>
    </h3>
    <p style="font-size: 12px; color: #666;">Search for CAS, Lab Slang or IUPAC.</p>
    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
        <input type="text" id="knowitall-input" placeholder="z.B. Aspirin oder 50-78-2" style="flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <button id="knowitall-search-btn" style="padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Suchen</button>
    </div>
    <ul id="knowitall-results" style="list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px;">
        </ul>
    </div>

    <script>
      require('./dist/renderer.js');
    </script>
</body>
</html>
