<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Mein Chemie Editor</title>
    <style>
      body { font-family: sans-serif; }
      
      /* Toolbar Styling */
      #toolbar { margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
      button { padding: 5px 10px; cursor: pointer; }

      /* Das PSE Popup (Initial versteckt) */
      #pse-menu {
        display: none; /* Standardmäßig unsichtbar */
        position: absolute;
        top: 50px; left: 10px;
        background: white;
        border: 2px solid #333;
        padding: 10px;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        z-index: 1000; /* Immer ganz oben */
      }

      /* Das Raster für die Elemente */
      #pse-grid {
        display: grid;
        grid-template-columns: repeat(18, 30px); /* 18 Spalten à 30px */
        grid-template-rows: repeat(7, 30px);     /* 7 Zeilen à 30px */
        gap: 2px;
      }

      /* Die einzelnen Element-Kacheln */
      .element-btn {
        width: 100%; height: 100%;
        border: 1px solid #999;
        font-size: 10px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .element-btn:hover { border-color: black; transform: scale(1.1); }
    </style>
  </head>
  <body>
    <h1>Chemie Editor Alpha</h1>
    
    <div id="toolbar">
      <button id="btn-draw" style="font-weight:bold; background-color:#ddd;">✏️ Zeichnen</button>
      <button id="btn-move">Move</button>
      <button id="btn-erase">Erase</button>
      <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
      
      <button id="btn-pse">Choose element...</button>
      <span id="current-element-display" style="font-weight: bold; margin-left: 5px;">[ C ]</span>

      <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
      <button id="btn-undo">Undo</button>
      <button id="btn-clear">Clear</button>
      <button id="btn-clean">Clean-up</button>
      <button id="btn-warnings" style="background-color: #ffcccc;">⚠️ Warnings: On</button>
    </div>

    <div id="pse-menu">
        <div id="pse-grid">
            </div>
        <button id="btn-close-pse" style="margin-top: 10px; width: 100%;">Close</button>
    </div>

    <canvas id="chemBoard" width="800" height="600" style="border:1px solid #ccc; cursor: crosshair;"></canvas>
    
    <script>
      require('./dist/renderer.js');
    </script>
  </body>
</html>
